
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Recupere o acesso à sua conta SafeMarket de forma segura.">

    <meta name="theme-color" content="#111B3A">

    <title>Recuperar senha | SafeMarket</title>

    <!-- Estilização -->
    <link rel="stylesheet" href="../css/recuperar-senha.css">

    <!-- Ícones -->
    <script src="https://unpkg.com/lucide@latest" defer></script>

    <!-- Integração e funcionalidades -->
    <script src="../js/api.js" defer></script>
    <script src="../js/recuperar-senha.js" defer></script>
</head>

<body>

    <main class="pagina-recuperacao">

        <section class="cartao-recuperacao"
            aria-labelledby="titulo-recuperacao">

            <header class="cabecalho-recuperacao">

                <a href="index.html"
                    class="marca-safemarket"
                    aria-label="SafeMarket - Voltar para o login">

                    <i data-lucide="shield-check"
                        aria-hidden="true"></i>

                    <span>SafeMarket</span>

                </a>

                <div class="icone-recuperacao"
                    aria-hidden="true">

                    <i data-lucide="lock-keyhole"></i>

                </div>

                <h1 id="titulo-recuperacao">
                    Esqueceu sua senha?
                </h1>

                <p>
                    Não se preocupe! Informe o e-mail cadastrado
                    e enviaremos as instruções para recuperar
                    seu acesso.
                </p>

            </header>

            <form id="form-recuperacao" novalidate>

                <div class="grupo-campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail cadastrado"
                        autocomplete="email"
                        required
                        aria-describedby="erro-email"
                    >

                    <small
                        id="erro-email"
                        class="mensagem-campo"
                        aria-live="polite">
                    </small>

                </div>

                <div
                    id="mensagem-recuperacao"
                    class="mensagem-recuperacao"
                    role="status"
                    aria-live="polite">
                </div>

                <button
                    type="submit"
                    id="btn-enviar-instrucoes"
                    disabled>

                    <span class="texto-botao">
                        Enviar instruções
                    </span>

                </button>

            </form>

            <footer class="rodape-recuperacao">

                <a href="index.html">

                    <i data-lucide="arrow-left"
                        aria-hidden="true"></i>

                    <span>Voltar para o login</span>

                </a>

            </footer>

        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>

</body>
</html>
