
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeMarket - Criar conta</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>

    <div class="login-card cadastro-card">

<div class="logo-container">
    <div class="logo-glass">
        <img src="../imagem/logo.png" alt="Logo SafeMarket">
    </div>
</div>
        <h2 class="titulo-cadastro">Criar conta</h2>

        <p class="subtitulo-cadastro">
        </p>

        <form id="form-cadastro">

            <div class="campo-cadastro">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="campo-cadastro">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo-cadastro">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <div class="campo-cadastro">
                <label for="confirmar-senha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmar-senha"
                    placeholder="Digite a senha novamente"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="bnt-login">
                CRIAR CONTA
            </button>

            <div id="mensagem-cadastro" role="status"></div>

        </form>

        <div class="separador-cadastro">
            <span>OU CADASTRE-SE COM</span>
        </div>

        <div class="botoes-sociais">

            <button type="button" class="botao-social"
                id="cadastro-google">
                <strong class="google-icone">G</strong>
                Google
            </button>

            <button type="button" class="botao-social"
                id="cadastro-facebook">
                <strong class="facebook-icone">f</strong>
                Facebook
            </button>

        </div>

        <div class="links-recuperacao">
            <a href="index.html">Já tem uma conta? Entrar</a>
        </div>

    </div>

    <script src="../js/api.js"></script>
<script src="../js/cadastro.js"></script>

</body>

</html>
