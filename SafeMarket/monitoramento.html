
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Monitoramento de atividades e segurança do SafeMarket">

    <title>SafeMarket - Monitoramento</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/monitoramento.js" defer></script>
    <script src="../js/menu.js" defer></script>
</head>

<body>

    <!-- Menu lateral padronizado -->
    <aside class="menu-lateral" id="menu-lateral">

        <div class="menu-topo">
            <h2 class="logo-menu">SafeMarket</h2>

            <button
                type="button"
                class="botao-menu"
                id="alternar-menu"
                aria-label="Recolher menu"
                aria-expanded="true"
                aria-controls="menu-navegacao"
                title="Recolher menu"
            >
                <i data-lucide="panel-left-close" aria-hidden="true"></i>
            </button>
        </div>

        <nav id="menu-navegacao" aria-label="Menu principal">

            <a href="dashboard.html" title="Dashboard">
                <i data-lucide="layout-dashboard" aria-hidden="true"></i>
                <span>Dashboard</span>
            </a>

            <a href="monitoramento.html"
               aria-current="page"
               title="Monitoramento">
                <i data-lucide="activity" aria-hidden="true"></i>
                <span>Monitoramento</span>
            </a>

            <a href="auditoria.html" title="Auditoria">
                <i data-lucide="clipboard-check" aria-hidden="true"></i>
                <span>Auditoria</span>
            </a>

            <a href="alertas.html" title="Alertas">
                <i data-lucide="shield-alert" aria-hidden="true"></i>
                <span>Alertas</span>
            </a>

            <a href="usuarios.html" title="Usuários">
                <i data-lucide="users" aria-hidden="true"></i>
                <span>Usuários</span>
            </a>

            <a href="configuracoes.html" title="Configurações">
                <i data-lucide="settings" aria-hidden="true"></i>
                <span>Configurações</span>
            </a>

            <a href="pericia.html" title="Perícia Digital">
                <i data-lucide="search" aria-hidden="true"></i>
                <span>Perícia Digital</span>
            </a>

        </nav>
    </aside>

    <!-- Conteúdo principal -->
    <main class="conteudo">

        <header>
            <h1>Monitoramento</h1>

            <p class="descricao-pagina">
                Acompanhe a atividade e a segurança do sistema.
            </p>
        </header>

        <!-- Indicadores -->
        <section class="cartoes" aria-label="Indicadores de monitoramento">

            <article class="cartao">
                <i data-lucide="user-check" class="icone-cartao" aria-hidden="true"></i>
                <h3>Usuários ativos</h3>
                <p id="usuarios-ativos" aria-live="polite">—</p>
            </article>

            <article class="cartao">
                <i data-lucide="package" class="icone-cartao" aria-hidden="true"></i>
                <h3>Anúncios ativos</h3>
                <p id="anuncios-ativos" aria-live="polite">—</p>
            </article>

            <article class="cartao">
                <i data-lucide="shield-alert" class="icone-cartao" aria-hidden="true"></i>
                <h3>Ações suspeitas</h3>
                <p id="acoes-suspeitas" aria-live="polite">—</p>
            </article>

            <article class="cartao">
                <i data-lucide="handshake" class="icone-cartao" aria-hidden="true"></i>
                <h3>Negociações</h3>
                <p id="total-negociacoes" aria-live="polite">—</p>
            </article>

        </section>

        <!-- Atividades do sistema -->
        <section class="atividades" aria-labelledby="titulo-atividades">

            <h2 id="titulo-atividades">
                <i data-lucide="activity" class="icone-titulo" aria-hidden="true"></i>
                Atividade do sistema
            </h2>

            <div id="lista-atividades" aria-live="polite">
                <p>Nenhuma atividade carregada.</p>
            </div>

        </section>

        <p id="mensagem-monitoramento" role="status" aria-live="polite"></p>

    </main>

    <script>
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>

</body>
</html>
