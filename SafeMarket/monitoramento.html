
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- =========================================
         1. CONFIGURAÇÕES DO DOCUMENTO
    ========================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Monitoramento de atividades e segurança do SafeMarket">

    <meta name="theme-color" content="#111B3A">

    <title>SafeMarket | Monitoramento</title>


    <!-- =========================================
         2. FOLHAS DE ESTILO
    ========================================== -->

    <!-- Estilização global -->
    <link rel="stylesheet" href="../css/dashboard.css">

    <!-- Estilização do menu lateral -->
    <link rel="stylesheet" href="../css/menu.css">

    <!-- Estilização específica do monitoramento -->
    <link rel="stylesheet" href="../css/monitoramento.css">


    <!-- =========================================
         3. BIBLIOTECAS E JAVASCRIPT
    ========================================== -->

    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Comunicação com a API -->
    <script src="../js/api.js" defer></script>

    <!-- Funcionalidades do monitoramento -->
    <script src="../js/monitoramento.js" defer></script>

    <!-- Funcionamento do menu lateral -->
    <script src="../js/menu.js" defer></script>

</head>

<body>

    <!-- =========================================
         4. MENU LATERAL
    ========================================== -->

    <aside class="menu-lateral" id="menu-lateral">

        <!-- Cabeçalho do menu -->
        <div class="menu-topo">

            <h2 class="logo-menu">SafeMarket</h2>

            <button
                type="button"
                class="botao-menu"
                id="alternar-menu"
                aria-label="Recolher menu"
                aria-expanded="true"
                aria-controls="menu-navegacao"
                title="Recolher menu">

                <i data-lucide="panel-left-close"
                    aria-hidden="true"></i>

            </button>

        </div>


        <!-- Navegação principal -->
        <nav id="menu-navegacao" aria-label="Menu principal">

            <!-- 1. Dashboard -->
            <a href="dashboard.html">
                <i data-lucide="layout-dashboard"
                    aria-hidden="true"></i>
                <span>Dashboard</span>
            </a>


            <!-- 2. Usuários -->
            <a href="usuarios.html">
                <i data-lucide="users"
                    aria-hidden="true"></i>
                <span>Usuários</span>
            </a>


            <!-- 3. Auditoria e Logs -->
            <a href="auditoria.html">
                <i data-lucide="clipboard-list"
                    aria-hidden="true"></i>
                <span>Auditoria e Logs</span>
            </a>


            <!-- 4. Monitoramento -->
            <a href="monitoramento.html"
                class="ativo"
                aria-current="page">

                <i data-lucide="activity"
                    aria-hidden="true"></i>

                <span>Monitoramento</span>

            </a>


            <!-- 5. Alertas -->
            <a href="alertas.html">
                <i data-lucide="shield-alert"
                    aria-hidden="true"></i>
                <span>Alertas</span>
            </a>


            <!-- 6. Perícia Digital -->
            <a href="pericia.html">
                <i data-lucide="search"
                    aria-hidden="true"></i>
                <span>Perícia Digital</span>
            </a>


            <!-- 7. Configurações -->
            <a href="configuracoes.html">
                <i data-lucide="settings"
                    aria-hidden="true"></i>
                <span>Configurações</span>
            </a>

        </nav>

    </aside>


    <!-- =========================================
         5. CONTEÚDO PRINCIPAL
    ========================================== -->

    <main class="conteudo">

        <!-- Cabeçalho da página -->
        <header class="cabecalho-pagina">

            <h1>Monitoramento</h1>

            <p class="descricao-pagina">
                Acompanhe a atividade e a segurança do sistema.
            </p>

        </header>


        <!-- =====================================
             6. INDICADORES DE MONITORAMENTO
        ====================================== -->

        <section
            class="cartoes"
            aria-label="Indicadores de monitoramento">


            <!-- Usuários ativos -->
            <article class="cartao">

                <i data-lucide="user-check"
                    class="icone-cartao"
                    aria-hidden="true"></i>

                <div>

                    <h3>Usuários ativos</h3>

                    <p id="usuarios-ativos"
                        aria-live="polite">—</p>

                </div>

            </article>


            <!-- Anúncios ativos -->
            <article class="cartao">

                <i data-lucide="package"
                    class="icone-cartao"
                    aria-hidden="true"></i>

                <div>

                    <h3>Anúncios ativos</h3>

                    <p id="anuncios-ativos"
                        aria-live="polite">—</p>

                </div>

            </article>


            <!-- Ações suspeitas -->
            <article class="cartao">

                <i data-lucide="shield-alert"
                    class="icone-cartao"
                    aria-hidden="true"></i>

                <div>

                    <h3>Ações suspeitas</h3>

                    <p id="acoes-suspeitas"
                        aria-live="polite">—</p>

                </div>

            </article>


            <!-- Negociações -->
            <article class="cartao">

                <i data-lucide="handshake"
                    class="icone-cartao"
                    aria-hidden="true"></i>

                <div>

                    <h3>Negociações</h3>

                    <p id="total-negociacoes"
                        aria-live="polite">—</p>

                </div>

            </article>

        </section>


        <!-- =====================================
             7. ATIVIDADES DO SISTEMA
        ====================================== -->

        <section
            class="atividades"
            aria-labelledby="titulo-atividades">


            <!-- Título da seção -->
            <h2 id="titulo-atividades">

                <i data-lucide="activity"
                    class="icone-titulo"
                    aria-hidden="true"></i>

                Atividade do sistema

            </h2>


            <!-- Lista preenchida pelo JavaScript -->
            <div
                id="lista-atividades"
                aria-live="polite"
                aria-relevant="additions text">

                <p>Nenhuma atividade carregada.</p>

            </div>

        </section>


        <!-- =====================================
             8. MENSAGENS DO SISTEMA
        ====================================== -->

        <p
            id="mensagem-monitoramento"
            role="status"
            aria-live="polite">
        </p>

    </main>


    <!-- =========================================
         9. INICIALIZAÇÃO DOS ÍCONES
    ========================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            if (window.lucide) {
                window.lucide.createIcons();
            }

        });

    </script>

</body>
</html>
