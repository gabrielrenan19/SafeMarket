
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerenciamento de usuários do SafeMarket">

    <title>SafeMarket - Usuários</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/usuarios.js" defer></script>
    <script src="../js/menu.js" defer></script>
</head>

<body>

    <!-- Menu lateral -->
    <aside class="menu-lateral" id="menu-lateral">

        <div class="menu-topo">
            <h2 class="logo-menu">SafeMarket</h2>

            <button
                type="button"
                class="botao-menu"
                id="alternar-menu"
                aria-label="Recolher menu"
                aria-expanded="true"
                aria-controls="menu-navegacao"
                title="Recolher menu">

                <i data-lucide="panel-left-close" aria-hidden="true"></i>

            </button>
        </div>

        <nav id="menu-navegacao" aria-label="Menu principal">

            <a href="dashboard.html" title="Dashboard">
                <i data-lucide="layout-dashboard" aria-hidden="true"></i>
                <span>Dashboard</span>
            </a>

            <a href="monitoramento.html" title="Monitoramento">
                <i data-lucide="activity" aria-hidden="true"></i>
                <span>Monitoramento</span>
            </a>

            <a href="auditoria.html" title="Auditoria">
                <i data-lucide="clipboard-check" aria-hidden="true"></i>
                <span>Auditoria</span>
            </a>

            <a href="alertas.html" title="Alertas">
                <i data-lucide="shield-alert" aria-hidden="true"></i>
                <span>Alertas</span>
            </a>

            <a href="usuarios.html" aria-current="page" title="Usuários">
                <i data-lucide="users" aria-hidden="true"></i>
                <span>Usuários</span>
            </a>

            <a href="configuracoes.html" title="Configurações">
                <i data-lucide="settings" aria-hidden="true"></i>
                <span>Configurações</span>
            </a>

            <a href="pericia.html" title="Perícia Digital">
                <i data-lucide="search" aria-hidden="true"></i>
                <span>Perícia Digital</span>
            </a>

        </nav>
    </aside>

    <!-- Conteúdo principal -->
    <main class="conteudo">

        <header>
            <h1>Usuários</h1>

            <p class="descricao-pagina">
                Gerencie e acompanhe os usuários da plataforma.
            </p>
        </header>

        <section class="atividades" aria-labelledby="titulo-usuarios">

            <h2 id="titulo-usuarios">Usuários cadastrados</h2>

            <div id="lista-usuarios" aria-live="polite">
                <p>Nenhum usuário carregado.</p>
            </div>

        </section>

        <p id="mensagem-usuarios" role="status" aria-live="polite"></p>

    </main>

    <script>
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>

</body>

</html>
