
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeMarket | Entrar</title>

    <!-- Estilos compartilhados -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Estilos exclusivos do login -->
    <link rel="stylesheet" href="../css/login.css">

    <!-- Biblioteca de ícones -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <main class="login-card">

        <!-- Logo do SafeMarket -->
        <div class="logo-container">
            <div class="logo-glass">
                <img src="../imagem/logo.png" alt="Logo SafeMarket">
            </div>
        </div>

        <!-- Formulário de login -->
        <form id="form-login">

            <!-- Campo de e-mail -->
            <div class="input-com-icone">
                <i data-lucide="mail" class="icone" aria-hidden="true"></i>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    aria-label="E-mail"
                    required
                >
            </div>

            <!-- Campo de senha -->
            <div class="input-com-icone">
                <i data-lucide="lock-keyhole" class="icone" aria-hidden="true"></i>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    aria-label="Senha"
                    required
                >
            </div>

            <!-- Botão de entrada -->
            <button class="bnt-login" type="submit">
                ENTRAR
            </button>

            <!-- Mensagens do login -->
            <div id="mensagem-login" role="status" aria-live="polite"></div>

        </form>

        <!-- Recuperação de senha -->
        <nav class="links-recuperacao" aria-label="Opções da conta">
            <a href="recuperar-senha.html">Esqueci a senha</a>
        </nav>

    </main>

    <!-- Inicialização dos ícones -->
    <script>
        lucide.createIcons();
    </script>

    <!-- Scripts do sistema -->
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>

</body>
</html>
